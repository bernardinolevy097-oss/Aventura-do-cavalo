<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aventura do Cavalo</title>
<style>
*{box-sizing:border-box}
body{margin:0;text-align:center;background:#70cfff;font-family:Arial,sans-serif;overflow-x:hidden;touch-action:manipulation}
h2{color:white;text-shadow:2px 2px #333;margin:12px 0 5px}
#score{font-weight:bold;font-size:20px;margin:8px}
canvas{display:block;width:96%;max-width:850px;height:auto;margin:auto;background:#70cfff;border:4px solid white;border-radius:10px;touch-action:pan-y}
.controls{margin:10px}
button{background:#ffcf36;border:0;border-radius:12px;padding:14px 22px;font-size:22px;margin:4px;touch-action:none}
#message{padding:0 10px}
</style>
</head>
<body>
<h2>🐎 AVENTURA DO CAVALO 🐎</h2>
<p id="score">Pontuação: 0</p>
<canvas id="game" width="800" height="400"></canvas>
<div class="controls">
<button id="left" aria-label="Esquerda">⬅️</button>
<button id="jump">⬆️ PULAR</button>
<button id="right" aria-label="Direita">➡️</button>
</div>
<button onclick="restart()">🔄 Reiniciar</button>
<p id="message">Colete moedas e desvie das cobras!</p>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let horse,snake,coins,score,camera,gameOver,win,keys={},frame=0;
const platforms=[
{x:0,y:350,w:1700,h:50},{x:220,y:285,w:110,h:15},
{x:440,y:245,w:110,h:15},{x:680,y:290,w:120,h:15},
{x:950,y:260,w:120,h:15},{x:1200,y:290,w:120,h:15}
];
function restart(){
 horse={x:40,y:300,w:40,h:42,vy:0,ground:false};
 snake={x:500,dir:1};
 coins=[150,260,350,470,550,720,780,990,1050,1250,1400].map((x,i)=>({x,y:i%2===0?310:220,taken:false}));
 score=0;camera=0;gameOver=false;win=false;keys={};
 document.getElementById("message").textContent="Colete moedas e desvie das cobras!";
 document.getElementById("score").textContent="Pontuação: 0";
}
function draw(){
 ctx.clearRect(0,0,800,400);
 ctx.fillStyle="#70cfff";ctx.fillRect(0,0,800,400);
 ctx.fillStyle="white";
 for(let i=0;i<7;i++){let x=(i*260-camera*.2)%1100;ctx.beginPath();ctx.arc(x,65,22,0,7);ctx.arc(x+25,60,28,0,7);ctx.arc(x+50,65,20,0,7);ctx.fill();}
 ctx.fillStyle="#55b947";ctx.fillRect(0,350,800,50);
 ctx.fillStyle="#98602f";ctx.fillRect(0,365,800,35);
 platforms.slice(1).forEach(p=>{ctx.fillStyle="#9b6535";ctx.fillRect(p.x-camera,p.y,p.w,p.h);ctx.fillStyle="#55bd47";ctx.fillRect(p.x-camera,p.y,p.w,6);});
 coins.forEach(c=>{if(!c.taken){ctx.fillStyle="#ffcc00";ctx.beginPath();ctx.arc(c.x-camera,c.y,11,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d88b00";ctx.lineWidth=3;ctx.stroke();}});
 if(!gameOver&&!win){let sx=snake.x-camera;ctx.fillStyle="#238c35";ctx.beginPath();ctx.ellipse(sx,340,23,11,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(sx+18,330,10,0,7);ctx.fill();ctx.fillStyle="white";ctx.fillRect(sx+20,326,4,4);ctx.fillStyle="red";ctx.fillRect(sx+26,337,8,3);}
 let hx=horse.x-camera,bounce=horse.ground?Math.sin(frame*.3)*2:0;
 ctx.save();ctx.translate(hx+20,horse.y+20+bounce);
 ctx.fillStyle="#914b24";ctx.beginPath();ctx.ellipse(0,3,19,11,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(13,-12,9,0,7);ctx.fill();
 ctx.beginPath();ctx.moveTo(10,-19);ctx.lineTo(9,-30);ctx.lineTo(16,-20);ctx.fill();
 ctx.fillStyle="#392017";ctx.beginPath();ctx.moveTo(6,-18);ctx.lineTo(-5,-13);ctx.lineTo(4,-8);ctx.lineTo(-3,-3);ctx.lineTo(9,-6);ctx.fill();
 ctx.strokeStyle="#392017";ctx.lineWidth=4;
 for(let i=0;i<4;i++){let swing=Math.sin(frame*.45+i*Math.PI)*5;ctx.beginPath();ctx.moveTo(-12+i*8,9);ctx.lineTo(-12+i*8+swing,20);ctx.stroke();}
 ctx.fillStyle="white";ctx.beginPath();ctx.arc(16,-14,3,0,7);ctx.fill();ctx.fillStyle="black";ctx.beginPath();ctx.arc(17,-14,1.5,0,7);ctx.fill();ctx.restore();
 ctx.fillStyle="#e83c3c";ctx.fillRect(1530-camera,220,12,130);ctx.fillStyle="white";ctx.fillRect(1542-camera,220,55,30);ctx.fillStyle="#222";ctx.font="14px Arial";ctx.fillText("FIM",1550-camera,240);
 if(gameOver||win){ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillRect(0,0,800,400);ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 38px Arial";ctx.fillText(win?"VOCÊ VENCEU!":"FIM DE JOGO",400,175);ctx.font="22px Arial";ctx.fillText("Pontuação: "+score,400,220);ctx.fillText("Toque em Reiniciar",400,260);ctx.textAlign="left";}
}
function update(){
 frame++;
 if(!gameOver&&!win){
 let oldY=horse.y;horse.vy+=.55;horse.y+=horse.vy;
 if(keys.right)horse.x+=4;if(keys.left)horse.x-=4;horse.ground=false;
 platforms.forEach(p=>{if(horse.x+horse.w>p.x&&horse.x<p.x+p.w&&oldY+horse.h<=p.y&&horse.y+horse.h>=p.y&&horse.vy>=0){horse.y=p.y-horse.h;horse.vy=0;horse.ground=true;}});
 coins.forEach(c=>{if(!c.taken&&Math.abs(horse.x+20-c.x)<24&&Math.abs(horse.y+20-c.y)<27){c.taken=true;score+=100;document.getElementById("score").textContent="Pontuação: "+score;}});
 snake.x+=snake.dir*2;if(snake.x>850||snake.x<420)snake.dir*=-1;
 if(Math.abs(horse.x+20-snake.x)<30&&Math.abs(horse.y+35-335)<28){if(horse.vy>1&&horse.y<315){snake.x=-500;horse.vy=-9;}else gameOver=true;}
 if(horse.y>430)gameOver=true;if(horse.x>1580)win=true;
 horse.x=Math.max(0,Math.min(1600,horse.x));camera=Math.max(0,horse.x-300);
 }
 draw();requestAnimationFrame(update);
}
function jump(){if(horse.ground&&!gameOver&&!win){horse.vy=-11;horse.ground=false;}}
function control(id,key){const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[key]=true;};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>keys[key]=false;}
control("left","left");control("right","right");
document.getElementById("jump").onpointerdown=e=>{e.preventDefault();jump();};
window.onkeydown=e=>{if(e.key==="ArrowRight"||e.key==="d")keys.right=true;if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;if(e.key===" "||e.key==="ArrowUp")jump();};
window.onkeyup=e=>{if(e.key==="ArrowRight"||e.key==="d")keys.right=false;if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;};
restart();update();
</script>
</body>
</html>
